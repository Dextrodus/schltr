# Builds the site and deploys it to Cloudflare Pages.
# - push to main     -> production deployment of the Pages project, at schltr.pages.dev
#                       (the staging site until schltr.com is attached at go-live)
# - pull request     -> preview deployment at <branch>.<project>.pages.dev
# Setup and go-live steps: docs/deployment.md
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: schltr
  BUILD_DIR: dist

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets, so they can't deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Check what can run
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::No package.json yet, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, skipping deploy (see docs/deployment.md)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.build == 'true' && hashFiles('pnpm-lock.yaml') != ''

      - uses: actions/setup-node@v4
        if: steps.check.outputs.build == 'true'
        with:
          # Uses .nvmrc when the app has one, Node 24 LTS otherwise.
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && '24' || '' }}

      - name: Install dependencies
        if: steps.check.outputs.build == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Build
        if: steps.check.outputs.build == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm run build; else npm run build; fi
          # Deployment-only headers (noindex on staging) go after whatever the app ships.
          if [ -f "$BUILD_DIR/_headers" ]; then echo >> "$BUILD_DIR/_headers"; fi
          cat deploy/_headers >> "$BUILD_DIR/_headers"

      - name: Create the Pages project if it doesn't exist yet
        if: steps.check.outputs.build == 'true' && steps.check.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qE "(^|[^a-z0-9-])${PAGES_PROJECT}([^a-z0-9-]|$)"; then
            echo "Pages project ${PAGES_PROJECT} exists."
          else
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.build == 'true' && steps.check.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes wrangler@4 pages deploy "$BUILD_DIR" \
            --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          {
            echo "### Deployed \`$BRANCH\`"
            echo
            echo "Deployment: ${url:-see log}"
          } >> "$GITHUB_STEP_SUMMARY"
